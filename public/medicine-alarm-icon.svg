<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)" stroke="#10b981" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Subtle Medical Cross at Top -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="240" y="80" width="32" height="80" rx="10"/>
    <rect x="216" y="104" width="80" height="32" rx="10"/>
  </g>

  <!-- Alarm Bell -->
  <g filter="url(#shadow)">
    <!-- Bell Top Ring -->
    <circle cx="256" cy="190" r="16" fill="none" stroke="#ffffff" stroke-width="8"/>
    <!-- Bell Main Body -->
    <path d="M 190 320 C 190 230 220 205 256 205 C 292 205 322 230 322 320 Z" fill="#ffffff"/>
    <!-- Bell Flared Base -->
    <path d="M 166 320 C 166 320 180 345 256 345 C 332 345 346 320 346 320 Z" fill="#ffffff"/>
    <rect x="166" y="320" width="180" height="24" rx="12" fill="#ffffff"/>
    <!-- Bell Clapper -->
    <circle cx="256" cy="365" r="22" fill="url(#gold)" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Sound Waves (Left & Right) -->
  <path d="M 140 240 A 50 50 0 0 0 140 310" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 110 215 A 85 85 0 0 0 110 335" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M 372 240 A 50 50 0 0 1 372 310" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 402 215 A 85 85 0 0 1 402 335" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- Pill Badge in Bottom Right -->
  <g transform="translate(330, 330)">
    <circle cx="65" cy="65" r="65" fill="#0f172a" stroke="#34d399" stroke-width="6" filter="url(#shadow)"/>
    <g transform="rotate(-45 65 65)">
      <rect x="35" y="45" width="30" height="40" rx="15" fill="#ffffff"/>
      <rect x="65" y="45" width="30" height="40" rx="15" fill="#0284c7"/>
    </g>
  </g>
</svg>
